{% extends "layout.html" %}

{% block title %}
    Sell
{% endblock %}

{% block main %}
    <form action="/sell" method="post">
        <select name="stock" class="form-select mx-auto w-auto mb-3" aria-label=".form-select-lg example">
            <option selected>Your stocks</option>
            {% for stock in stocks %}
                <option value="{{stock}}">{{stock}}</option>
            {% endfor %}
          </select>
          <input autocomplete="off" autofocus class="mb-3 form-control mx-auto w-auto" id="username" name="shares" placeholder="Number of Stocks" type="number" required>
        <button class="btn btn-primary" type="submit">Sell</button>
    </form>
{% endblock %}
